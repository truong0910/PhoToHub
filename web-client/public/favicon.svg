<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4c5c" />
      <stop offset="100%" stop-color="#0d3b66" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb8500" />
      <stop offset="100%" stop-color="#e36414" />
    </linearGradient>
  </defs>
  <!-- Background Shield/Rounded Card -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#bgGrad)" />
  
  <!-- Camera Body -->
  <rect x="22" y="32" width="56" height="42" rx="10" fill="none" stroke="#ffffff" stroke-width="5" />
  
  <!-- Top Flash Bump -->
  <path d="M 38 32 L 44 23 L 56 23 L 62 32 Z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" />
  
  <!-- Lens Outer Circle -->
  <circle cx="50" cy="53" r="15" fill="none" stroke="#ffffff" stroke-width="5" />
  
  <!-- Lens Inner Accent Aperture -->
  <circle cx="50" cy="53" r="8" fill="url(#accentGrad)" />
  
  <!-- Flash Dot -->
  <circle cx="68" cy="40" r="3" fill="url(#accentGrad)" />

  <!-- Sparkle Accent Top Right -->
  <path d="M 75 18 L 77 24 L 83 26 L 77 28 L 75 34 L 73 28 L 67 26 L 73 24 Z" fill="url(#accentGrad)" />
</svg>